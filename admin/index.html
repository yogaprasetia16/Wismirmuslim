<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Admin WISMIR</title>
<style>
:root{--bg:#faf6f0;--surface:#fff;--ink:#2b2420;--muted:#7a6d64;--accent:#6b4f3f;--sage:#7c8b6f;--line:#e8dfd4;--red:#b3392f;--ok:#2f7d4f}
@media (prefers-color-scheme:dark){:root{--bg:#1c1815;--surface:#26211d;--ink:#f3ece4;--muted:#b3a69b;--accent:#d2b49c;--sage:#a3b394;--line:#3a332d;--red:#e0675c;--ok:#5fbf86}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-text-size-adjust:100%}
h1,h2{font-family:Georgia,"Times New Roman",serif;font-weight:600;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:820px;margin:0 auto;padding:0 16px 120px}
[hidden]{display:none!important}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--accent);background:var(--accent);color:var(--bg);border-radius:999px;padding:10px 20px;font-weight:600;cursor:pointer;font-size:15px}
.btn.line{background:transparent;color:var(--accent)}
.btn.red{background:transparent;color:var(--red);border-color:var(--red)}
.btn.sm{padding:6px 14px;font-size:14px}
.btn:disabled{opacity:.55;cursor:default}
.field{display:flex;flex-direction:column;gap:6px;margin:0 0 16px}
.field>label,.lbl{font-size:14px;font-weight:600}
.hint{font-size:13px;color:var(--muted);font-weight:400}
input[type=text],input[type=password],input[type=url],select,textarea{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);font-size:16px}
textarea{min-height:110px;resize:vertical}
.login{max-width:380px;margin:12vh auto 0;padding:28px 22px;background:var(--surface);border:1px solid var(--line);border-radius:18px}
.login h1{font-size:28px;margin-bottom:4px}
.login p{color:var(--muted);margin:0 0 18px;font-size:14px}
.err{color:var(--red);font-size:14px;min-height:20px;margin:6px 0 0}
header.bar{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px}
header.bar h1{font-size:22px}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}
.tools input{flex:1;min-width:160px;border-radius:999px}
.tools select{width:auto;border-radius:999px}
.count{color:var(--muted);font-size:14px;margin:0 0 10px}
.list{display:grid;gap:10px}
.item{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px}
.th{flex:0 0 64px;height:84px;border-radius:10px;background:var(--line);overflow:hidden;position:relative}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.th span{position:absolute;inset:0;display:grid;place-items:center;font-size:11px;color:var(--muted);text-align:center;padding:4px}
.meta{flex:1;min-width:0}
.meta b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta small{color:var(--muted)}
.tags{display:flex;gap:6px;margin-top:4px}
.tag{font-size:11px;font-weight:700;letter-spacing:.06em;padding:2px 8px;border-radius:99px;color:#fff}
.tag.n{background:var(--sage)}.tag.s{background:var(--red)}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:6;box-shadow:0 8px 24px rgba(0,0,0,.25);padding:14px 22px}
.ov{position:fixed;inset:0;z-index:20;background:var(--bg);overflow:auto}
.ov .bar{position:sticky}
.sw{display:flex;align-items:center;gap:10px;font-weight:600;cursor:pointer}
.sw input{width:22px;height:22px;accent-color:var(--accent)}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.ph{position:relative;aspect-ratio:3/4;border-radius:12px;overflow:hidden;background:var(--line);border:2px solid transparent}
.ph.cover{border-color:var(--accent)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .ctl{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;padding:4px;background:linear-gradient(transparent,rgba(0,0,0,.65))}
.ph .ctl button{width:30px;height:30px;border:0;border-radius:50%;background:rgba(255,255,255,.9);color:#222;font-size:15px;cursor:pointer;line-height:1}
.ph .x{position:absolute;top:4px;right:4px;width:28px;height:28px;border:0;border-radius:50%;background:var(--red);color:#fff;font-size:16px;cursor:pointer;line-height:1}
.ph .badge{position:absolute;top:4px;left:4px;background:var(--accent);color:var(--bg);font-size:10px;font-weight:700;padding:2px 7px;border-radius:99px}
.ph .new{position:absolute;top:30px;left:4px;background:var(--sage);color:#fff;font-size:10px;font-weight:700;padding:2px 7px;border-radius:99px}
.add{aspect-ratio:3/4;border:2px dashed var(--line);border-radius:12px;display:grid;place-items:center;text-align:center;color:var(--accent);font-weight:600;cursor:pointer;font-size:14px;padding:6px}
.add input{display:none}
.actions{position:sticky;bottom:0;display:flex;gap:10px;justify-content:space-between;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(12px);border-top:1px solid var(--line)}
.actions .btn{flex:1}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;z-index:50;max-width:min(92vw,420px);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.toast.bad{background:var(--red);color:#fff}
.busy{position:fixed;inset:0;z-index:40;background:rgba(20,15,12,.55);display:grid;place-items:center;color:#fff;font-weight:600;text-align:center;padding:20px}
.spin{width:36px;height:36px;border:4px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:r .8s linear infinite;margin:0 auto 12px}
@keyframes r{to{transform:rotate(360deg)}}
.note{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:14px;color:var(--muted);margin:0 0 16px}
</style>
</head>
<body>

<!-- ISI ALAMAT API SETELAH APPS SCRIPT DI-DEPLOY (lihat PANDUAN.md). Boleh dikosongkan; nanti diminta di layar masuk. -->
<script>const API_URL = "https://script.google.com/macros/s/AKfycbxa-oS3R_gWM8h7hKEXBOiXHLCqu0Dilq3DrVOH5yPQSHoN4rCcDApQa8_r99T8FuJfZg/exec";</script>

<main id="login" class="login" hidden>
  <h1>Admin WISMIR</h1>
  <p>Masukkan kata sandi untuk mengelola produk.</p>
  <form id="lf">
    <div class="field" id="apirow" hidden><label for="lapi">Alamat API</label><input id="lapi" type="url" placeholder="https://script.google.com/macros/s/.../exec" autocomplete="off"></div>
    <div class="field"><label for="lpw">Kata sandi</label><input id="lpw" type="password" autocomplete="current-password" required></div>
    <label class="sw" style="margin-bottom:14px"><input id="lrem" type="checkbox"> Ingat di perangkat ini</label>
    <button class="btn" style="width:100%" id="lbtn">Masuk</button>
    <p class="err" id="lerr" role="alert"></p>
  </form>
</main>

<div id="app" hidden>
  <header class="bar"><h1>Produk WISMIR</h1><span><a class="btn line sm" href="../" target="_blank" rel="noopener">Lihat web</a> <button class="btn line sm" id="out">Keluar</button></span></header>
  <div class="wrap">
    <div class="tools"><input id="q" type="text" placeholder="Cari produk" aria-label="Cari produk"><select id="cf" aria-label="Kategori"></select></div>
    <p class="count" id="cnt"></p>
    <div class="list" id="list"></div>
  </div>
  <button class="btn fab" id="add">+ Produk baru</button>
</div>

<div id="ed" class="ov" hidden>
  <header class="bar"><h1 id="edt">Produk</h1><button class="btn line sm" id="edx">Tutup</button></header>
  <div class="wrap" style="padding-bottom:20px"><form id="ef" autocomplete="off"></form></div>
  <div class="actions"><button class="btn red" id="edd" type="button">Hapus</button><button class="btn" id="eds" type="button">Simpan</button></div>
</div>

<div id="busy" class="busy" hidden><div><div class="spin"></div><span id="busyt">Menyimpan...</span></div></div>
<div id="toast" class="toast" hidden></div>

<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const KATS=["Gamis","Atasan","Bawahan","Oneset"];
const MAXSIDE=1400,QUALITY=.82;
let pass="",api="",items=[],headers=[],cur=null,photos=[],tt=0;

// ---------- penyimpanan kecil (aman kalau diblokir) ----------
const ls={g(k){try{return localStorage.getItem(k)||""}catch(e){return ""}},s(k,v){try{localStorage.setItem(k,v)}catch(e){}},d(k){try{localStorage.removeItem(k)}catch(e){}}};
const ss={g(k){try{return sessionStorage.getItem(k)||""}catch(e){return ""}},s(k,v){try{sessionStorage.setItem(k,v)}catch(e){}},d(k){try{sessionStorage.removeItem(k)}catch(e){}}};

function toast(m,bad){const t=$("toast");t.textContent=m;t.className="toast"+(bad?" bad":"");t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,bad?6000:4500)}
function busy(on,txt){$("busy").hidden=!on;if(txt)$("busyt").textContent=txt}

async function call(action,payload){
  let r;
  try{r=await fetch(api,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(Object.assign({pass,action},payload||{}))})}
  catch(e){throw new Error("Tidak bisa menghubungi server. Cek internet atau alamat API.")}
  let j;try{j=await r.json()}catch(e){throw new Error("Jawaban server tidak dikenali. Pastikan Apps Script sudah di-deploy sebagai Web app (akses: Anyone).")}
  if(!j.ok){if(/kata sandi/i.test(j.error||"")){logout(true)}throw new Error(j.error||"Terjadi kesalahan.")}
  return j;
}

// ---------- foto ----------
const tokens=v=>String(v||"").split(/[\s|,]+/).filter(Boolean);
const isUrl=t=>/^https?:/i.test(t);
function thumbOf(t){
  if(!isUrl(t))return "../foto/"+t.replace(/^foto\//,"");
  const m=t.match(/drive\.google\.com\/file\/d\/([\w-]+)/)||(/drive\.google\.com/.test(t)&&t.match(/[?&]id=([\w-]+)/));
  return m?`https://drive.google.com/thumbnail?id=${m[1]}&sz=w400`:t;
}
const newName=()=>"p"+Date.now().toString(36)+Math.random().toString(36).slice(2,6)+".jpg";
async function shrink(file){
  let bmp;
  try{bmp=await createImageBitmap(file,{imageOrientation:"from-image"})}
  catch(e){bmp=await new Promise((ok,no)=>{const i=new Image(),u=URL.createObjectURL(file);i.onload=()=>ok(i);i.onerror=()=>no(new Error("Foto tidak bisa dibaca: "+file.name));i.src=u})}
  const w=bmp.width||bmp.naturalWidth,h=bmp.height||bmp.naturalHeight,r=Math.min(1,MAXSIDE/Math.max(w,h));
  const c=document.createElement("canvas");c.width=Math.round(w*r);c.height=Math.round(h*r);
  const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(bmp,0,0,c.width,c.height);
  return new Promise((ok,no)=>c.toBlob(b=>b?ok(b):no(new Error("Gagal memproses foto")),"image/jpeg",QUALITY));
}
const toB64=b=>new Promise((ok,no)=>{const f=new FileReader();f.onload=()=>ok(String(f.result).split(",")[1]);f.onerror=()=>no(new Error("Gagal membaca foto"));f.readAsDataURL(b)});

// ---------- masuk / keluar ----------
function showLogin(msg){
  $("app").hidden=true;$("ed").hidden=true;$("login").hidden=false;
  $("apirow").hidden=!!API_URL;if(!$("lapi").value)$("lapi").value=ls.g("wismir_api");$("lerr").textContent=msg||"";
}
function logout(silent){pass="";ss.d("wismir_pw");ls.d("wismir_pw");if(silent!==true)toast("Anda sudah keluar.");showLogin(silent===true?"Kata sandi salah atau sudah diganti. Silakan masuk lagi.":"")}
$("out").onclick=()=>logout();
$("lf").addEventListener("submit",async e=>{
  e.preventDefault();
  api=API_URL||$("lapi").value.trim();pass=$("lpw").value;
  if(!/^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec/.test(api)){$("lerr").textContent="Alamat API belum benar.";return}
  $("lbtn").disabled=true;$("lerr").textContent="";
  try{await load();if(!API_URL)ls.s("wismir_api",api);(($("lrem").checked)?ls:ss).s("wismir_pw",pass);$("lpw").value="";$("login").hidden=true;$("app").hidden=false}
  catch(err){$("lerr").textContent=err.message}
  $("lbtn").disabled=false;
});

// ---------- daftar produk ----------
async function load(){
  const j=await call("list");items=j.items;headers=j.headers;renderList();
}
function cats(){return[...new Set([...KATS,...items.map(i=>i.kategori).filter(Boolean)])]}
function renderList(){
  const q=$("q").value.trim().toLowerCase(),c=$("cf").value||"";
  const cf=$("cf");const have=cf.value;
  cf.innerHTML=`<option value="">Semua kategori</option>`+cats().map(k=>`<option${k===have?" selected":""}>${esc(k)}</option>`).join("");
  const L=items.filter(i=>(!c||i.kategori===c)&&(!q||(i.nama+" "+(i.bahan||"")).toLowerCase().includes(q)));
  $("cnt").textContent=`${L.length} dari ${items.length} produk`;
  $("list").innerHTML=L.map(i=>{const p=tokens(i.foto)[0];return `<div class="item"><div class="th">${p?`<img src="${esc(thumbOf(p))}" alt="" loading="lazy" onerror="this.remove()">`:`<span>Belum ada foto</span>`}</div>
  <div class="meta"><b>${esc(i.nama)}</b><small>${esc(i.kategori||"")}${i.ukuran?" · "+esc(i.ukuran):""} · ${tokens(i.foto).length} foto</small><div class="tags">${/^(ya|y|yes|true|1)$/i.test(i.terbaru||"")?'<span class="tag n">NEW</span>':""}${/^(ya|y|yes|true|1)$/i.test(i.sale||"")?'<span class="tag s">SALE</span>':""}</div></div>
  <button class="btn line sm" data-r="${i._row}">Edit</button></div>`}).join("")||`<p class="count">Tidak ada produk yang cocok.</p>`;
}
$("q").addEventListener("input",renderList);$("cf").addEventListener("change",renderList);
$("list").addEventListener("click",e=>{const b=e.target.closest("[data-r]");if(b)openEd(items.find(i=>i._row===+b.dataset.r))});
$("add").onclick=()=>openEd(null);

// ---------- editor ----------
const AREA=["deskripsi","detail"],CHK=["terbaru","sale"];
const LABEL={nama:"Nama produk",kategori:"Kategori",bahan:"Bahan",ukuran:"Ukuran",terbaru:"Tandai sebagai TERBARU (muncul di Koleksi Terbaru)",sale:"Tandai sebagai SALE",foto:"Foto",deskripsi:"Deskripsi singkat",detail:"Detail produk",harga:"Harga (contoh: Rp 199.000)",harga_normal:"Harga normal sebelum diskon",warna:"Warna"};
const HINT={detail:"Satu baris satu poin. Awali dengan tanda - agar tampil sebagai daftar poin.",ukuran:"Contoh: S, M, L, XL atau All Size.",harga_normal:"Hanya tampil (dicoret) kalau SALE dicentang."};
function openEd(it){
  cur=it;photos=it?tokens(it.foto).map(t=>({kind:"old",token:t})):[];
  $("edt").textContent=it?"Edit produk":"Produk baru";$("edd").hidden=!it;
  const cs=cats();
  $("ef").innerHTML=headers.map(h=>{
    const v=it?(it[h]||""):"",L=LABEL[h]||h.charAt(0).toUpperCase()+h.slice(1),hint=HINT[h]?`<span class="hint">${HINT[h]}</span>`:"";
    if(h==="foto")return `<div class="field"><span class="lbl">Foto</span><span class="hint">Foto pertama jadi foto utama. Foto otomatis dikecilkan.</span><div class="photos" id="pg"></div></div>`;
    if(CHK.includes(h))return `<div class="field"><label class="sw"><input type="checkbox" data-h="${h}"${/^(ya|y|yes|true|1)$/i.test(v)?" checked":""}> ${esc(L)}</label></div>`;
    if(h==="kategori"){const ok=!v||cs.includes(v);return `<div class="field"><label for="f_${h}">${esc(L)}</label><select id="f_${h}" data-h="${h}">${cs.map(k=>`<option${k===v?" selected":""}>${esc(k)}</option>`).join("")}<option value="__baru"${ok?"":" selected"}>Lainnya (ketik sendiri)</option></select><input type="text" id="f_kb" placeholder="Nama kategori baru" value="${ok?"":esc(v)}"${ok?" hidden":""}></div>`}
    if(AREA.includes(h))return `<div class="field"><label for="f_${h}">${esc(L)}</label>${hint}<textarea id="f_${h}" data-h="${h}">${esc(v)}</textarea></div>`;
    return `<div class="field"><label for="f_${h}">${esc(L)}</label>${hint}<input type="text" id="f_${h}" data-h="${h}" value="${esc(v)}"${h==="nama"?" required":""}></div>`;
  }).join("")+(headers.includes("harga")?"":`<p class="note">Kolom harga belum ada di Sheet. Tambahkan kolom bernama <b>harga</b> di Sheet agar kolom harga muncul di form ini dan di web.</p>`);
  const ks=$("f_kategori");if(ks)ks.onchange=()=>{$("f_kb").hidden=ks.value!=="__baru";if(!$("f_kb").hidden)$("f_kb").focus()};
  drawPhotos();$("ed").hidden=false;$("ed").scrollTop=0;document.body.style.overflow="hidden";
}
function closeEd(){$("ed").hidden=true;document.body.style.overflow=""}
$("edx").onclick=closeEd;
function drawPhotos(){
  const g=$("pg");if(!g)return;
  g.innerHTML=photos.map((p,i)=>`<div class="ph${i?"":" cover"}"><img src="${esc(p.kind==="new"?p.url:thumbOf(p.token))}" alt="Foto ${i+1}" onerror="this.style.visibility='hidden'">${i?"":'<span class="badge">UTAMA</span>'}${p.kind==="new"?'<span class="new">BARU</span>':""}<button class="x" type="button" data-x="${i}" aria-label="Hapus foto">×</button><div class="ctl"><button type="button" data-m="${i}:-1" aria-label="Geser ke kiri"${i?"":" disabled"}>‹</button><button type="button" data-m="${i}:1" aria-label="Geser ke kanan"${i<photos.length-1?"":" disabled"}>›</button></div></div>`).join("")
   +`<label class="add"><input type="file" id="pf" accept="image/*" multiple>+ Tambah foto</label>`;
  $("pf").onchange=async e=>{
    const fs=[...e.target.files];if(!fs.length)return;
    busy(true,"Memproses foto...");
    try{for(const f of fs){const b=await shrink(f);photos.push({kind:"new",name:newName(),blob:b,url:URL.createObjectURL(b)})}}
    catch(err){toast(err.message,true)}
    busy(false);drawPhotos();
  };
}
$("ef").addEventListener("click",e=>{
  const x=e.target.closest("[data-x]"),m=e.target.closest("[data-m]");
  if(x){photos.splice(+x.dataset.x,1);drawPhotos()}
  if(m){const[i,d]=m.dataset.m.split(":").map(Number),j=i+d;if(photos[j]){[photos[i],photos[j]]=[photos[j],photos[i]];drawPhotos()}}
});
$("ef").addEventListener("submit",e=>e.preventDefault());

// foto lama milik produk ini yang tidak dipakai produk lain (aman dihapus dari GitHub)
function orphans(removed,exceptRow){
  const used=new Set(items.filter(i=>i._row!==exceptRow).flatMap(i=>tokens(i.foto).map(t=>t.replace(/^foto\//,""))));
  return [...new Set(removed.filter(t=>!isUrl(t)).map(t=>t.replace(/^foto\//,"")))].filter(n=>!used.has(n));
}
function collect(){
  const d={};
  $("ef").querySelectorAll("[data-h]").forEach(el=>{
    const h=el.dataset.h;
    d[h]=el.type==="checkbox"?(el.checked?"ya":""):(h==="kategori"&&el.value==="__baru"?$("f_kb").value.trim():el.value.trim());
  });
  d.foto=photos.map(p=>p.kind==="new"?p.name:p.token).join("|");
  return d;
}
$("eds").onclick=async()=>{
  const d=collect();
  if(!d.nama){toast("Nama produk wajib diisi.",true);return}
  if(!d.kategori&&headers.includes("kategori")){toast("Pilih atau isi kategori.",true);return}
  const keep=new Set(photos.filter(p=>p.kind==="old").map(p=>p.token));
  const removed=cur?tokens(cur.foto).filter(t=>!keep.has(t)):[];
  const news=photos.filter(p=>p.kind==="new");
  busy(true,news.length?`Menyimpan dan mengunggah ${news.length} foto...`:"Menyimpan...");
  try{
    const np=[];for(const p of news)np.push({name:p.name,b64:await toB64(p.blob)});
    await call("save",{row:cur?cur._row:null,origNama:cur?cur.nama:null,data:d,newPhotos:np,deleteFiles:orphans(removed,cur?cur._row:0)});
    await load();closeEd();
    toast("Tersimpan. Perubahan tampil di web sekitar 1 sampai 5 menit; foto baru butuh 1 sampai 2 menit.");
  }catch(err){toast(err.message,true)}
  busy(false);
};
$("edd").onclick=async()=>{
  if(!cur||!confirm(`Hapus produk "${cur.nama}"? Tindakan ini tidak bisa dibatalkan.`))return;
  busy(true,"Menghapus...");
  try{await call("delete",{row:cur._row,nama:cur.nama,deleteFiles:orphans(tokens(cur.foto),cur._row)});await load();closeEd();toast("Produk dihapus.")}
  catch(err){toast(err.message,true)}
  busy(false);
};
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("ed").hidden)closeEd()});

// ---------- mulai ----------
