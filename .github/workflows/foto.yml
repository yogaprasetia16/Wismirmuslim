name: Rapikan dan cek foto

on:
  push:
    branches: [main]
    paths: ["foto/**"]
  schedule:
    - cron: "40 2 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  foto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - name: Kecilkan foto yang terlalu besar
        run: python scripts/compress_foto.py
      - name: Buat foto kecil untuk kartu katalog
        run: python scripts/make_thumbs.py
      - name: Commit jika ada perubahan
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add foto
          git diff --staged --quiet || (git commit -m "Kecilkan foto baru otomatis dan buat foto kecil" && git pull --rebase -q && git push)
      - name: Cek foto terpakai dan hilang
        run: python scripts/audit_foto.py
      - name: Cek situs live (halaman dan semua foto bisa dibuka)
        continue-on-error: true
        run: python scripts/check_live.py
