name: Perbarui foto pratinjau

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  og:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: python scripts/update_og.py
      - name: Perbarui katalog.json dari Sheet
        run: python scripts/update_katalog.py
      - name: Buat halaman pratinjau per produk
        run: python scripts/update_share.py
      - name: Commit jika ada perubahan
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add og-image.jpg index.html p katalog.json
          git diff --staged --quiet || (git commit -m "Perbarui foto pratinjau, halaman produk, dan katalog" && git pull --rebase -q && git push)
